<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" width="240" height="210" role="img" aria-label="A magpie following Ariadne's thread, in Julia colors">
  <title>Magpie.jl</title>

  <!-- Ariadne's thread: one continuous string the magpie follows, beaded with the three Julia dots -->
  <path d="M 16 196 C 58 188 70 150 116 146 S 176 120 200 86 S 222 60 228 50"
        fill="none" stroke="#8a8a96" stroke-width="3" stroke-linecap="round"/>
  <circle cx="116" cy="146" r="8" fill="#9558B2"/>   <!-- Julia purple -->
  <circle cx="190" cy="98"  r="8" fill="#389826"/>   <!-- Julia green  -->
  <circle cx="228" cy="50"  r="8" fill="#CB3C33"/>   <!-- Julia red    -->

  <!-- Magpie: pied (black + white), with an iridescent Julia sheen on the long tail -->
  <g>
    <!-- long graduated tail, sweeping down-left -->
    <path d="M 96 112 L 18 92 L 24 104 L 100 124 Z" fill="#2a2d43"/>
    <path d="M 32 95  L 22 92  L 28 104 L 38 106 Z" fill="#4063D8"/>  <!-- blue sheen   -->
    <path d="M 50 100 L 40 97  L 46 109 L 56 111 Z" fill="#389826"/>  <!-- green sheen  -->
    <path d="M 68 105 L 58 102 L 64 114 L 74 116 Z" fill="#9558B2"/>  <!-- purple sheen -->

    <!-- body -->
    <ellipse cx="112" cy="104" rx="36" ry="25" fill="#2a2d43"/>
    <!-- white belly -->
    <ellipse cx="120" cy="114" rx="24" ry="12" fill="#f4f4f7"/>
    <!-- white scapular patch -->
    <ellipse cx="98" cy="92" rx="11" ry="6.5" fill="#f4f4f7" transform="rotate(-20 98 92)"/>
    <!-- wing, with an iridescent dot -->
    <path d="M 104 88 C 128 84 146 92 148 108 C 132 96 114 94 104 98 Z" fill="#1f2236"/>
    <circle cx="132" cy="100" r="3.2" fill="#389826"/>

    <!-- head -->
    <circle cx="146" cy="84" r="16" fill="#2a2d43"/>
    <!-- beak, pointing up-right toward the thread ahead -->
    <path d="M 158 76 L 178 80 L 159 90 Z" fill="#e8a33d"/>
    <!-- eye -->
    <circle cx="150" cy="81" r="3.3" fill="#f4f4f7"/>
    <circle cx="151" cy="81" r="1.7" fill="#15151c"/>
  </g>
</svg>
